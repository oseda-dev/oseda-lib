name: Check
run-name: OSEDA check command

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed for run local git diff against main

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Install oseda from crates.io
        run: cargo install oseda-cli

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Detect course directory and run check
        run: |
          FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          ADDED_DIR=$(echo "$FILES" | grep '^courses/' | sed 's|^\(courses/[^/]*\)/.*|\1|' | sort -u | head -n 1)

          echo "Added directory: $ADDED_DIR"

          if [[ -z "$ADDED_DIR" ]]; then
            echo "No changes found under courses/. Skipping check."
            exit 0
          fi

          cd "$ADDED_DIR"

          echo "Installing Node.js dependencies..."
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

          echo "Running oseda check..."
          oseda check